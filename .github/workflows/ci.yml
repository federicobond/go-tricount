name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.26 is what go.mod declares, the oldest release Go still supports;
        # stable catches a new release breaking the package before someone
        # else's build does.
        go: ['1.26', 'stable']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      # The live tests are excluded from every build by their tag, so nothing
      # else would notice them failing to compile after an API change.
      - name: vet live tests
        run: go vet -tags live ./...

      # Pinned to a release rather than @latest, so a new check cannot turn
      # main red on its own; bump it deliberately. The live tag again, for
      # the same reason as vet.
      - name: staticcheck
        run: |
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 -tags live ./...

      - name: test
        run: go test -race ./...
